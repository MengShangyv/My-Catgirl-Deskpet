<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="bubble" class="bubble hidden"></div>
  <div id="pet" class="pet mood-idle">
    <img id="pet-img" class="pet-img" src="" alt="" draggable="false" />
    <div id="pet-fallback" class="pet-fallback">
      <!-- CSS 兜底 Q版猫娘 -->
      <div class="cat">
        <div class="ear ear-l"></div><div class="ear ear-r"></div>
        <div class="face">
          <div class="eye eye-l"></div><div class="eye eye-r"></div>
          <div class="mouth"></div><div class="blush blush-l"></div><div class="blush blush-r"></div>
        </div>
        <div class="paw paw-l"></div><div class="paw paw-r"></div>
        <div class="tail"></div>
      </div>
    </div>
  </div>
  <div id="hint" class="hint">双击穿透 · 单击详情</div>
  <script src="pet.js"></script>
</body>
</html>
